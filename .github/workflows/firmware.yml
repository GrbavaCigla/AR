name: Build firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/src/**"
      - "firmware/cmake/**"
      - "firmware/tools/**"
      - "firmware/CMakeLists.txt"
      - "firmware/linker.ld"
      - ".github/workflows/firmware.yml"
jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          dnf install -y \
            cmake \
            make \
            gcc \
            gcc-c++ \
            binutils \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            just
      - run: just
        working-directory: firmware
      - uses: actions/upload-artifact@v4
        with:
          name: instructions-mif
          path: firmware/build/instructions.mif
          if-no-files-found: error
